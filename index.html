<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1部 ダッシュボード</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0d14;font-family:'Hiragino Kaku Gothic ProN','Meiryo',sans-serif}
:root{--navy:#1a2744;--gold:#c8a040;--green:#2e9e68;--red:#c8372a;--blue:#2c72c7;--bg:#f7f7f9;--card:#fff;--border:#e4e4ee;--border2:#d0d0e0;--text:#1a1a2e;--text2:#5a5a72;--text3:#9898aa}
#nav{width:100%;background:var(--navy);border-bottom:2px solid var(--gold);padding:0.28em 0.8em;display:flex;align-items:center;gap:0.7em;flex-shrink:0;position:fixed;top:0;left:0;z-index:100;height:2.6em}
.nav-logo{font-size:0.9em;font-weight:700;color:var(--gold);letter-spacing:0.08em;white-space:nowrap}
.nav-dept-badge{background:var(--gold);color:#000;padding:0.15em 0.6em;border-radius:4px;font-size:0.82em;font-weight:700;white-space:nowrap}
.nav-tabs{display:flex;gap:0.25em;flex:1}
.nav-tab{padding:0.25em 0.7em;border-radius:4px;font-size:0.8em;font-weight:600;color:rgba(255,255,255,0.5);cursor:pointer;border:1px solid transparent;transition:all 0.15s;white-space:nowrap}
.nav-tab.active{background:rgba(255,255,255,0.12);color:#fff;border-color:rgba(255,255,255,0.2)}
.nav-tab:hover:not(.active){color:rgba(255,255,255,0.85);background:rgba(255,255,255,0.06)}
.nav-time{margin-left:auto;font-size:0.7em;color:rgba(255,255,255,0.4);white-space:nowrap}
#content{width:100vw;height:100vh;padding-top:2.6em;display:flex;flex-direction:column;overflow:hidden}
.tab-panel{flex:1;overflow:hidden;display:none}
.tab-panel.active{display:flex;flex-direction:column}
.spinner{width:1.6em;height:1.6em;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin 0.8s linear infinite;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 月間ボード ===== */
#monthly-wrap{width:100%;flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);font-size:clamp(7px,0.82vw,11px)}
#monthly-dept-tabs{display:flex;background:#111;flex-shrink:0}
.mdept-tab{flex:1;padding:0.25em 0;text-align:center;font-weight:700;font-size:0.95em;color:#666;cursor:pointer;border-right:1px solid #222;transition:all 0.15s}
.mdept-tab:last-child{border-right:none}
.mdept-tab.active{background:var(--bg);color:var(--navy)}
.mdept-tab:not(.active):hover{background:#1a1a1a;color:#aaa}
#monthly-board{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
#monthly-header{background:#fff;border-bottom:3px solid var(--navy);padding:0.22em 0.6em;display:flex;align-items:center;gap:0.8em;flex-shrink:0}
.hdr-month{font-size:2.2em;font-weight:900;color:var(--navy)}
.hdr-goal{display:flex;align-items:baseline;gap:0.2em;font-weight:700}
.hdr-goal .label{color:var(--text2);font-size:0.85em}
.hdr-goal .num{font-size:1.8em;font-weight:900;color:var(--navy)}
.hdr-goal .num.green{color:var(--green)}
.hdr-goal .unit{color:var(--text2);font-size:0.75em}
.hdr-goal .goal{font-size:1.15em;font-weight:800;color:var(--text2)}
.hdr-goal .pct{font-size:0.78em;font-weight:800;color:var(--text2);background:#f0f0e8;border-radius:3px;padding:0.1em 0.4em;margin-left:0.3em}
.hdr-goal .pct.done{color:#fff;background:var(--green)}
.hdr-sep{color:#ddd;font-size:1.6em}
.hdr-bucho{font-size:0.82em;color:var(--text2)}
.hdr-bucho strong{color:var(--navy)}
.hdr-btns{margin-left:auto;display:flex;gap:0.35em}
.hdr-btn{font-size:0.7em;padding:0.25em 0.65em;border:1px solid var(--border2);border-radius:4px;background:#fff;cursor:pointer;color:var(--text2)}
.hdr-btn:hover{background:var(--bg);color:var(--navy)}
.hdr-btn.danger{color:var(--red);border-color:#f0c0c0}
#monthly-main{display:flex;flex:1;overflow:hidden;padding:0.35em;gap:0.35em}
#monthly-courses-wrap{display:flex;flex:1;gap:0.35em;min-width:0}
.m-course{flex:1;display:flex;flex-direction:column;background:#fff;border-radius:6px;border:0.5px solid var(--border);overflow:hidden;min-width:0}
.m-course-hd{background:var(--navy);color:#fff;text-align:center;font-weight:800;font-size:1em;padding:0.2em;flex-shrink:0}
.m-course-meta{text-align:center;padding:0.1em 0;border-bottom:0.5px solid var(--border);background:#f5f4ee;flex-shrink:0;font-weight:800;font-size:0.85em;color:var(--navy)}
.m-col-hd{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr;border-bottom:0.5px solid var(--border);background:#eeeee6;flex-shrink:0}
.m-col-hd>div{text-align:center;padding:0.08em 0;font-size:0.65em;color:var(--text3);font-weight:600;border-right:0.5px solid var(--border)}
.m-col-hd>div:last-child{border-right:none}
.m-col-hd-ap{display:flex;flex-direction:column;border-right:none}
.m-col-hd-ap .apt{font-size:0.62em;color:var(--text3);border-bottom:0.5px solid var(--border);padding:0.04em 0;flex:1;display:flex;align-items:center;justify-content:center}
.m-col-hd-ap .apb{font-size:0.62em;color:var(--blue);padding:0.04em 0;flex:1;display:flex;align-items:center;justify-content:center}
.m-members{flex:1;display:flex;flex-direction:column;overflow:hidden}
.m-mrow{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr;border-bottom:0.5px solid #f0f0e8;align-items:stretch;flex:1;min-height:0}
.m-mrow:last-child{border-bottom:none}
.m-mname{padding:0.08em 0.18em;font-weight:700;font-size:0.78em;display:flex;align-items:center;overflow:hidden;white-space:nowrap;margin:1px 1px 1px 2px;border-radius:3px;color:#fff}
.m-ccell{display:flex;align-items:center;justify-content:center;border-left:0.5px solid var(--border);padding:0.08em 0}
.m-cnum{font-size:1.35em;font-weight:800;line-height:1;color:var(--text)}
.m-cnum.g{color:var(--green)}.m-cnum.r{color:var(--red)}
.m-ap-cell{display:flex;flex-direction:column;border-left:0.5px solid var(--border)}
.m-ap-half{display:flex;align-items:center;justify-content:center;flex:1;padding:0.06em}
.m-ap-half.top{border-bottom:0.5px solid var(--border)}
.m-ap-num{font-size:1.05em;font-weight:800;line-height:1;color:var(--text);min-width:1em;text-align:center}
.m-ap-num.b{color:var(--blue)}
.m-selcell{cursor:pointer;transition:background 0.12s}
.m-selcell:hover{background:#eef4ff}
.m-selcell.sel{background:#fff6dd;box-shadow:inset 0 0 0 2px var(--gold)}
#m-ctrl{width:8.5em;flex-shrink:0;background:#fff;border:0.5px solid var(--border);border-radius:6px;display:flex;flex-direction:column;align-items:center;padding:0.55em 0.45em;gap:0.5em}
.m-ctrl-title{font-size:0.72em;font-weight:700;color:var(--text3);letter-spacing:0.08em}
#m-ctrl-sel{width:100%;min-height:4.4em;border:0.5px dashed var(--border2);border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.18em;padding:0.3em 0.2em;text-align:center}
#m-ctrl-sel .cs-course{font-size:0.68em;color:var(--text3)}
#m-ctrl-sel .cs-name{font-size:1em;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#m-ctrl-sel .cs-type{font-size:0.72em;font-weight:700;color:#fff;background:var(--navy);border-radius:3px;padding:0.06em 0.5em}
#m-ctrl-sel .cs-hint{font-size:0.72em;color:var(--text3);line-height:1.6}
.m-ctrl-btn{width:100%;height:2.8em;font-size:1.5em;font-weight:800;border:none;border-radius:6px;cursor:pointer;user-select:none;transition:transform 0.05s;line-height:1}
.m-ctrl-btn:active:not(:disabled){transform:scale(0.95)}
.m-ctrl-btn.plus{background:var(--green);color:#fff}
.m-ctrl-btn.minus{background:var(--red);color:#fff}
.m-ctrl-btn:disabled{background:#e4e4ec;color:#b0b0bc;cursor:default}
.m-ctrl-val{font-size:2.1em;font-weight:900;color:var(--navy);line-height:1}
.m-ctrl-hint{font-size:0.62em;color:var(--text3);text-align:center;line-height:1.6}
/* 課ごとの合計行(メンバー行と同じグリッド列を使うことで上の欄とズレない) */
.m-trow{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr;border-top:1.5px solid var(--border2);background:#f5f4ec;flex-shrink:0;align-items:stretch}
.m-tlbl{display:flex;align-items:center;padding:0.18em 0.25em;font-weight:800;font-size:0.78em;color:var(--text2)}
.m-tcell{display:flex;align-items:center;justify-content:center;border-left:0.5px solid var(--border);font-size:1.1em;font-weight:800;color:var(--text)}
.m-tcell.g{color:var(--green)}.m-tcell.r{color:var(--red)}
.m-tap{display:flex;flex-direction:column;border-left:0.5px solid var(--border)}
.m-tap-half{flex:1;display:flex;align-items:center;justify-content:center;font-size:0.85em;font-weight:800;color:var(--text);padding:0.05em 0}
.m-tap-half.top{border-bottom:0.5px solid var(--border)}
.m-tap-half.zoom{color:var(--blue)}

/* ===== 出張・配置ボード ===== */
#schedule-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);font-size:clamp(8px,1vw,15px)}
#schedule-header{background:var(--navy);padding:0.28em 0.8em;display:flex;align-items:center;gap:0.8em;flex-shrink:0;border-bottom:1.5px solid var(--gold)}
.s-title{font-size:1.2em;font-weight:700;color:#fff}
.s-date{font-size:0.85em;color:rgba(255,255,255,0.6)}
.s-status{font-size:0.65em;color:rgba(255,255,255,0.4);margin-left:auto}
.s-refresh{font-size:0.68em;padding:0.22em 0.55em;border:1px solid rgba(255,255,255,0.25);border-radius:3px;background:transparent;color:rgba(255,255,255,0.6);cursor:pointer}
#schedule-main{display:flex;flex:1;overflow:hidden;padding:0.45em;gap:0.45em}
#cal-panel{flex:1.4;display:flex;flex-direction:column}
.s-panel-title{font-size:0.95em;font-weight:600;color:var(--navy);border-bottom:1.5px solid var(--navy);padding-bottom:0.18em;margin-bottom:0.25em;flex-shrink:0}
#cal-wrap{flex:1;background:#fff;border-radius:6px;border:0.5px solid var(--border);overflow:hidden;display:flex;flex-direction:column}
.cal-hdr{display:grid;grid-template-columns:repeat(7,1fr);background:var(--navy);flex-shrink:0}
.cal-dow{text-align:center;padding:0.22em 0;font-size:0.78em;font-weight:700;color:rgba(255,255,255,0.8)}
.cal-dow.sun{color:#ff9999}.cal-dow.sat{color:#99bbff}
.cal-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);border-left:0.5px solid var(--border);border-top:0.5px solid var(--border)}
.cal-cell{border-right:0.5px solid var(--border);border-bottom:0.5px solid var(--border);padding:0.08em 0.12em;overflow:hidden;display:flex;flex-direction:column}
.cal-cell.other-month{background:#f9f9fc}
.cal-cell.today-cell{background:#fffbf0}
.day-num{font-size:0.82em;font-weight:700;color:var(--text2);line-height:1.3;flex-shrink:0}
.day-num.sun{color:#cc3333}.day-num.sat{color:#2255cc}
.day-num.is-today{background:var(--navy);color:#fff;width:1.4em;height:1.4em;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.78em}
.cal-evs{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:1px;margin-top:1px}
.cal-ev{font-size:0.72em;padding:1px 3px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4;flex-shrink:0}
.ev-kinko{background:#dbeafe;color:#1a4f8a;border-left:2px solid var(--blue)}
.ev-shurui{background:#f0f0f5;color:#44445a;border-left:2px solid #888}
#catch-panel{flex:1;display:flex;flex-direction:column}
.catch-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:0.32em;margin-top:0.25em}
.catch-card{background:#fff;border-radius:6px;border:0.5px solid var(--border);overflow:hidden;display:flex;flex-direction:column}
.cc-head{padding:0.22em 0.45em;font-size:0.88em;font-weight:700;color:#fff;flex-shrink:0}
.cc-0{background:#92400e}.cc-1{background:#c2410c}.cc-2{background:#1d4ed8}.cc-3{background:#15803d}
.cc-4{background:#6d28d9}.cc-5{background:#be185d}.cc-6{background:#b91c1c}.cc-7{background:#374151}
.cc-body{flex:1;padding:0.18em 0.38em;display:flex;flex-wrap:wrap;gap:0.15em;align-content:flex-start;overflow:hidden}
.m-tag{background:#f0f0f8;border:0.5px solid var(--border2);border-radius:3px;padding:0.08em 0.32em;font-size:0.85em;color:var(--text);font-weight:500}
.no-data{font-size:0.78em;color:var(--text3)}

/* ===== アポイントボード ===== */
#appoint-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);font-size:clamp(8px,1vw,15px)}
#appoint-header{background:var(--navy);padding:0.28em 0.8em;display:flex;align-items:center;gap:0.8em;flex-shrink:0;border-bottom:1.5px solid var(--gold)}
.a-title{font-size:1.2em;font-weight:700;color:#fff}
.a-date{font-size:0.85em;color:rgba(255,255,255,0.6)}
.a-cnt{font-size:0.78em;color:rgba(255,255,255,0.6)}
.a-cnt span{color:#fff;font-weight:700}
.a-cnt span.red{color:#ff9999}
.a-status{font-size:0.65em;color:rgba(255,255,255,0.4)}
.a-refresh{font-size:0.68em;padding:0.22em 0.55em;border:1px solid rgba(255,255,255,0.25);border-radius:3px;background:transparent;color:rgba(255,255,255,0.6);cursor:pointer;margin-left:auto}
.a-sec-hd{background:var(--navy);color:#fff;padding:0.16em 0.65em;font-size:0.88em;font-weight:700;flex-shrink:0;display:flex;align-items:center;gap:0.45em}
.a-badge{display:inline-block;background:rgba(255,255,255,0.15);border-radius:3px;padding:0.04em 0.35em;font-size:0.85em}
.a-badge.red{background:rgba(200,55,42,0.4)}
#today-section{flex:0 0 54%;display:flex;flex-direction:column;border-bottom:2px solid var(--gold);overflow:hidden}
#today-cols{flex:1;display:grid;gap:0.22em;padding:0.22em 0.38em;overflow:hidden}
.today-col{display:flex;flex-direction:column;gap:0.08em;overflow:hidden}
.a-thead{display:grid;grid-template-columns:2.5em 3.8em 5.2em 4.2em 1fr;background:#eef0f6;border-radius:3px;flex-shrink:0}
.a-th{padding:0.16em 0.3em;font-size:0.75em;font-weight:700;color:var(--text2)}
.a-trow{display:grid;grid-template-columns:2.5em 3.8em 5.2em 4.2em 1fr;align-items:center;padding:0.1em 0.3em;border-radius:3px;border:0.5px solid var(--border);background:#fff;flex:1;min-height:0}
.a-trow.keiyaku{background:#fff8f8;border-color:#f0d0d0}
.a-td{font-size:0.92em;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-td.time{font-weight:700}.a-td.time.red{color:var(--red)}
.a-ic{display:inline-flex;align-items:center;justify-content:center;width:1.35em;height:1.35em;border-radius:50%;font-size:0.65em;font-weight:700;border:1.5px solid}
.bd-d{border-color:var(--blue);color:var(--blue);background:#e6f1fb}
.bd-a{border-color:var(--green);color:var(--green);background:#edf7f2}
.bd-n{border-color:#aaa;color:#888;background:#f5f5f5}
.a-ktag{display:inline-block;background:#fff0f0;color:var(--red);border:0.5px solid #f0cccc;border-radius:3px;padding:0.02em 0.22em;font-size:0.72em;font-weight:700;margin-left:0.18em;vertical-align:middle}
.a-bukken{font-size:0.78em;color:var(--red);display:block}
.a-empty{display:flex;align-items:center;justify-content:center;flex:1;color:var(--text3);font-size:0.88em}
#future-section{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
#future-cards{flex:1;display:grid;gap:0.25em;padding:0.22em 0.38em;overflow:hidden;min-height:0}
.f-card{background:#fff;border-radius:6px;border:0.5px solid var(--border);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.f-card-hd{background:var(--navy);color:#fff;padding:0.18em 0.42em;font-size:0.88em;font-weight:700;flex-shrink:0;display:flex;justify-content:space-between;align-items:center}
.f-card-sub{font-size:0.74em;font-weight:400;opacity:0.7}
.f-card-body{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:0.08em;padding:0.12em 0.28em;min-height:0}
.f-row{display:flex;align-items:flex-start;gap:0.18em;flex-shrink:0;border-bottom:0.5px solid #f5f5f5;padding-bottom:0.07em}
.f-row:last-child{border-bottom:none;padding-bottom:0}
.f-row.k{background:#fff5f5;border-radius:3px;padding:0.05em 0.18em}
.f-date{font-size:0.78em;font-weight:700;color:var(--text2);white-space:nowrap;flex-shrink:0;min-width:2.8em;line-height:1.3}
.f-date.red{color:var(--red)}
.f-info{font-size:0.8em;color:var(--text);overflow:hidden;flex:1;line-height:1.3}
.f-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-place{color:var(--text3);font-size:0.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-empty{font-size:0.8em;color:#c0c0cc;text-align:center;padding-top:0.3em}

/* ===== 成績ランキング ===== */
#ranking-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column;background:#f4f4f6;font-size:clamp(8px,1vw,15px)}
#ranking-header{background:var(--navy);color:#fff;padding:0.22em 0.8em;display:flex;align-items:center;gap:0.6em;flex-shrink:0;border-bottom:2px solid var(--gold)}
.r-title{font-size:1.2em;font-weight:500;letter-spacing:0.06em}
.r-status{margin-left:auto;font-size:0.68em;opacity:0.55}
.r-date{font-size:0.72em;opacity:0.6}
/* 4列レイアウト：個人（年間／3ヶ月）＋課（年間／3ヶ月） */
#r-board{flex:1;min-height:0;display:flex;gap:0.55em;padding:0.32em 0.4em 0.4em}
.r-group{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.r-group-hd{display:flex;align-items:baseline;gap:0.55em;color:var(--navy);border-bottom:2px solid var(--navy);padding:0 0.15em 0.1em;margin-bottom:0.28em;flex-shrink:0}
.r-group-hd b{font-size:1.25em;font-weight:700;letter-spacing:0.06em}
.r-group-hd span{font-size:0.74em;color:var(--text3);font-weight:600}
.r-group-lists{flex:1;min-height:0;display:flex;gap:0.3em}
.r-card{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff;border-radius:5px;border:0.5px solid var(--border);overflow:hidden}
.r-card-hd{padding:0.2em 0.5em;font-size:0.9em;font-weight:600;color:#fff;letter-spacing:0.05em;flex-shrink:0}
.r-hd-an{background:var(--navy)}.r-hd-q3{background:#2e6e3a}
/* 表本体：1つのグリッドで列幅を揃える（1行目=見出し、以降=順位行が等分） */
.r-grid{flex:1;min-height:0;display:grid;grid-template-columns:1.9em minmax(0,1fr) auto auto auto;grid-template-rows:auto;grid-auto-rows:minmax(0,1fr);overflow:hidden;font-size:clamp(1.05em,0.95vw,1.3em)}
.r-h{font-size:0.66em;font-weight:600;color:var(--text3);background:#eeeee6;padding:0.4em 0.5em;white-space:nowrap;border-bottom:0.5px solid var(--border)}
.r-h.num{text-align:right}
.r-c{display:flex;align-items:center;min-width:0;padding:0 0.5em;border-bottom:0.5px solid #f0f0f0;white-space:nowrap}
.r-c.ta{background:#fdf8e8}.r-c.tg{background:#edf7f0}
.r-grid>.r-c:nth-last-child(-n+5){border-bottom:none}
.r-rk{justify-content:flex-end;font-size:0.8em;font-weight:600;color:#b4b4c0}
.r-rk.t1{color:#b08a2a}.r-rk.t2{color:#7d858e}.r-rk.t3{color:#a06c2c}

<script>
const DEPT_NAME='1部';
const APPOINT_DB='71778839de25479e9fbb07a3edd67cff';
const SCHEDULE_CAL_DB='39c368b39ccb49e2a12c50207168ddce';
const CATCH_DB='84609900fe0e4400b78ba74984df76bd';
const APPOINT_COURSES=["川崎課","依田課","井岡課","宮下課","松浦課","土居課"];
const CATCH_LOCS=['淀屋橋','名古屋駅','JR大阪駅','パナソニックスタジアム','中之島','茶屋町','新大阪駅','尼崎駅'];

// ===== タブ切り替え =====
const REFRESH_MS=5*60*1000; // サイネージ用:5分ごとにNotionデータを自動更新
const R_REFRESH_MS=30*60*1000; // 成績(Salesforce)は30分ごとに再取得
let sTime=0,aTime=0,rTime=0;
function switchTab(name,el){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  el.classList.add('active');
  if(name==='schedule'&&Date.now()-sTime>REFRESH_MS)loadSchedule();
  if(name==='appoint'&&Date.now()-aTime>REFRESH_MS)loadAppoint();
  if(name==='ranking'&&Date.now()-rTime>R_REFRESH_MS)renderRanking();
}
setInterval(()=>{
  const p=document.querySelector('.tab-panel.active');if(!p)return;
  if(p.id==='panel-schedule')loadSchedule();
  else if(p.id==='panel-appoint')loadAppoint();
  else if(p.id==='panel-ranking'&&Date.now()-rTime>R_REFRESH_MS)renderRanking();
},REFRESH_MS);

// ===== 時計 =====
function tick(){const d=new Date();document.getElementById('nav-time').textContent=d.toLocaleDateString('ja-JP',{month:'short',day:'numeric',weekday:'short'})+' '+d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});}
tick();setInterval(tick,30000);
// ローカル(日本)時間ベースのYYYY-MM-DD。toISOString()はUTC変換のため朝9時前に日付がズレる
function isoLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function isoToday(){return isoLocal(new Date());}
function isoTomorrow(){const d=new Date();d.setDate(d.getDate()+1);return isoLocal(d);}
async function qNotion(dbId,filter){
  const body={page_size:100};if(filter)body.filter=filter;
  const r=await fetch('/api/notion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dbId,filter})});
  if(!r.ok)throw new Error('API error '+r.status);return r.json();
}
function gp(page,name){
  const p=page.properties[name];if(!p)return '';
  if(p.type==='title')return p.title.map(t=>t.plain_text).join('');
  if(p.type==='rich_text')return p.rich_text.map(t=>t.plain_text).join('');
  if(p.type==='select')return p.select?.name||'';
  if(p.type==='date')return p.date?.start||'';
  return '';
}

// =============================================
// ===== 月間ボード =====
// =============================================
const MS_KEY='board_settings_v9';const MD_KEY='board_data_v9';
const M_RL={kacho:{bg:'linear-gradient(135deg,#d07000,#e88020)'},kakarichou:{bg:'linear-gradient(135deg,#c83070,#e05590)'},shunin:{bg:'linear-gradient(135deg,#1a6ab0,#2c88cc)'},shain:{bg:'linear-gradient(135deg,#6a6a7a,#888898)'},shinnyuu:{bg:'linear-gradient(135deg,#2e9040,#48b058)'}};
const M_RLL={kacho:'課長',kakarichou:'係長',shunin:'主任',shain:'社員(2年目以上)',shinnyuu:'新入社員'};
const M_DEF=[
  {deptName:'1部',month:'6月',totalGoal:47,shinkiGoal:28,bucho:'大場',totalAdj:0,shinkiAdj:0,courses:[
    {name:'川崎課',target:12,members:[{name:'川崎',role:'kacho'},{name:'田新',role:'shain'},{name:'福平',role:'shain'},{name:'石川郡',role:'shain'},{name:'松見',role:'shain'},{name:'白鷺',role:'shain'},{name:'大竹',role:'shain'},{name:'川口',role:'shain'},{name:'小山',role:'shain'}]},
    {name:'依田課',target:10,members:[{name:'依田',role:'kacho'},{name:'安田',role:'shain'},{name:'永岡',role:'shain'},{name:'樽林',role:'shain'},{name:'都築',role:'shain'},{name:'若田',role:'shain'},{name:'阿部',role:'shain'},{name:'金澤',role:'shain'},{name:'吉田翔',role:'shain'}]},
    {name:'井岡課',target:10,members:[{name:'井岡',role:'kacho'},{name:'宮田',role:'shain'},{name:'清家',role:'shain'},{name:'宮部',role:'shain'},{name:'住田',role:'shain'},{name:'河',role:'shain'},{name:'伊藤洋',role:'shain'},{name:'川脇',role:'shain'},{name:'谷',role:'shain'}]},
    {name:'宮下課',target:10,members:[{name:'宮下',role:'kacho'},{name:'高田',role:'shain'},{name:'横瀬',role:'shain'},{name:'石田',role:'shain'},{name:'川畑優',role:'shain'},{name:'松永',role:'shain'},{name:'岩田',role:'shain'},{name:'河江',role:'shain'},{name:'畑',role:'shain'}]},
    {name:'松浦課',target:6,members:[{name:'松浦',role:'kacho'},{name:'黒木',role:'shain'},{name:'斉藤',role:'shain'},{name:'山元',role:'shain'},{name:'山内',role:'shain'},{name:'渡辺',role:'shain'},{name:'村田光',role:'shain'}]},
    {name:'土居課',target:6,members:[{name:'土居',role:'kacho'},{name:'永田',role:'shain'},{name:'松島',role:'shain'},{name:'山中',role:'shain'},{name:'川越',role:'shain'},{name:'塩沢',role:'shain'},{name:'山田紘',role:'shain'}]}
  ]},
  {deptName:'2部',month:'6月',totalGoal:0,shinkiGoal:0,bucho:'',totalAdj:0,shinkiAdj:0,courses:[{name:'幸課',target:0,members:[{name:'',role:'shain'}]},{name:'滝川課',target:0,members:[{name:'',role:'shain'}]},{name:'定行課',target:0,members:[{name:'',role:'shain'}]},{name:'梅原課',target:0,members:[{name:'',role:'shain'}]},{name:'馬場課',target:0,members:[{name:'',role:'shain'}]},{name:'橋本課',target:0,members:[{name:'',role:'shain'}]}]},
  {deptName:'3部',month:'6月',totalGoal:0,shinkiGoal:0,bucho:'',totalAdj:0,shinkiAdj:0,courses:[{name:'富川課',target:0,members:[{name:'',role:'shain'}]},{name:'平谷課',target:0,members:[{name:'',role:'shain'}]},{name:'平沼課',target:0,members:[{name:'',role:'shain'}]},{name:'林課',target:0,members:[{name:'',role:'shain'}]},{name:'古高課',target:0,members:[{name:'',role:'shain'}]},{name:'龍課',target:0,members:[{name:'',role:'shain'}]}]},
  {deptName:'5部',month:'6月',totalGoal:0,shinkiGoal:0,bucho:'',totalAdj:0,shinkiAdj:0,courses:[{name:'山本課',target:0,members:[{name:'',role:'shain'}]}]},
  {deptName:'7部',month:'6月',totalGoal:0,shinkiGoal:0,bucho:'',totalAdj:0,shinkiAdj:0,courses:[{name:'上田課',target:0,members:[{name:'',role:'shain'}]}]},
];
let mS,mD,mCD=0,mMD=0,mTM={};
try{mS=JSON.parse(localStorage.getItem(MS_KEY));if(!mS||mS.length!==5)throw 0;}catch(e){mS=JSON.parse(JSON.stringify(M_DEF));}
try{mD=JSON.parse(localStorage.getItem(MD_KEY))||{};}catch(e){mD={};}
function mg(d,c,m,t){return(mD[d]&&mD[d][c]&&mD[d][c][m]&&mD[d][c][m][t])||0;}
function ms(d,c,m,t,v){if(!mD[d])mD[d]={};if(!mD[d][c])mD[d][c]={};if(!mD[d][c][m])mD[d][c][m]={};mD[d][c][m][t]=Math.max(0,v);try{localStorage.setItem(MD_KEY,JSON.stringify(mD));}catch(e){}}
function mSave(){try{localStorage.setItem(MS_KEY,JSON.stringify(mS));}catch(e){}}
function mcSum(d,c,t){return(mS[d].courses[c]?.members||[]).reduce((s,_,m)=>s+mg(d,c,m,t),0);}
function maSum(d,t){return mS[d].courses.reduce((s,_,c)=>s+mcSum(d,c,t),0);}
function mFmt(n){return Number.isInteger(n)?String(n):n.toFixed(1);}
window.switchMDept=function(d,el){mCD=d;document.querySelectorAll('.mdept-tab').forEach((e,i)=>e.classList.toggle('active',i===d));renderM();};

// ===== セル選択+右端パネルで数値入力 =====
let mSel=null;
const M_TL={keiyaku:'契約',shinki:'新規',kaiyaku:'解約',ap:'対面AP',zoom:'ZOOM'};
window.mSelect=function(c,m,t,el){
  const same=mSel&&mSel.c===c&&mSel.m===m&&mSel.t===t;
  document.querySelectorAll('.m-selcell.sel').forEach(e=>e.classList.remove('sel'));
  if(same){mSel=null;}else{mSel={c,m,t};el.classList.add('sel');}
  updateMCtrl();
};
function mClearSel(){document.querySelectorAll('.m-selcell.sel').forEach(e=>e.classList.remove('sel'));mSel=null;updateMCtrl();}
function updateMCtrl(){
  const sel=document.getElementById('m-ctrl-sel');
  const plus=document.getElementById('m-ctrl-plus'),minus=document.getElementById('m-ctrl-minus'),val=document.getElementById('m-ctrl-val');
  if(!mSel){sel.innerHTML='<span class="cs-hint">セルを<br>クリックして<br>選択</span>';plus.disabled=true;minus.disabled=true;val.textContent='－';return;}
  const course=mS[mCD].courses[mSel.c];const mem=course?.members?.[mSel.m];
  sel.innerHTML=`<span class="cs-course">${course?.name||''}</span><span class="cs-name">${mem?.name||''}</span><span class="cs-type">${M_TL[mSel.t]}</span>`;
  plus.disabled=false;minus.disabled=false;
  val.textContent=mg(mCD,mSel.c,mSel.m,mSel.t);
}
window.mCtrl=function(delta){
  if(!mSel)return;
  const {c,m,t}=mSel;
  ms(mCD,c,m,t,mg(mCD,c,m,t)+delta);
  const v=mg(mCD,c,m,t);
  document.getElementById(`mn-${c}-${m}-${t}`).textContent=v;
  document.getElementById('m-ctrl-val').textContent=v;
  const f=document.getElementById(`mf-${t}-${c}`);if(f)f.textContent=mcSum(mCD,c,t);
  if(t==='ap'){const fa=document.getElementById('mf-ap-'+c);if(fa)fa.textContent=mcSum(mCD,c,'ap');}
  if(t==='zoom'){const fz=document.getElementById('mf-zoom-'+c);if(fz)fz.textContent=mcSum(mCD,c,'zoom');}
  updateMProg();
};
// キーボード操作: ↑/＋で+1、↓/－で-1、Escで選択解除(モーダル表示中はEscで閉じる)
document.addEventListener('keydown',e=>{
  if(document.getElementById('m-modal').style.display==='flex'){if(e.key==='Escape')closeMSettings();return;}
  if(!document.getElementById('panel-monthly').classList.contains('active'))return;
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;
  if(!mSel)return;
  if(e.key==='ArrowUp'||e.key==='+'){e.preventDefault();mCtrl(1);}
  else if(e.key==='ArrowDown'||e.key==='-'){e.preventDefault();mCtrl(-1);}
  else if(e.key==='Escape'){mClearSel();}
});

function setProg(prefix,val,goal){
  document.getElementById(prefix+'-prog').textContent=mFmt(val);
  document.getElementById(prefix+'-goal').textContent=mFmt(goal||0);
  const pctEl=document.getElementById(prefix+'-pct');
  if(goal>0){const p=Math.round(val/goal*100);pctEl.textContent=p+'%';pctEl.className='pct'+(p>=100?' done':'');pctEl.style.display='';}
  else{pctEl.textContent='';pctEl.style.display='none';}
}
function updateMProg(){
  const s=mS[mCD];
  setProg('m-total',maSum(mCD,'keiyaku')+(s.totalAdj||0),s.totalGoal);
  setProg('m-shinki',maSum(mCD,'shinki')+(s.shinkiAdj||0),s.shinkiGoal);
}
function renderM(){
  const s=mS[mCD];
  mSel=null;
  document.getElementById('m-month').textContent=s.month;
  document.getElementById('m-bucho').textContent=s.bucho;
  updateMProg();
  const wrap=document.getElementById('monthly-courses-wrap');wrap.innerHTML='';
  s.courses.forEach((course,c)=>{

async function loadSchedule(){
  sTime=Date.now();
  document.getElementById('s-status').textContent='更新中...';
  try{
    const d=new Date();
    const first=isoLocal(new Date(d.getFullYear(),d.getMonth(),1));
    const last=isoLocal(new Date(d.getFullYear(),d.getMonth()+1,0));
    const [calData,catchData]=await Promise.all([
      qNotion(SCHEDULE_CAL_DB,{and:[{property:'日付',date:{on_or_after:first}},{property:'日付',date:{on_or_before:last}}]}),
      qNotion(CATCH_DB,{property:'日付',date:{equals:isoToday()}})
    ]);
    buildCal(calData.results||[]);buildCatch(catchData.results||[]);
    document.getElementById('s-status').textContent='更新 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  }catch(e){document.getElementById('s-status').textContent='エラー: '+e.message;}
}
function buildCal(events){
  const d=new Date();const year=d.getFullYear(),month=d.getMonth();const todayStr=isoToday();
  const firstDay=new Date(year,month,1).getDay();const dim=new Date(year,month+1,0).getDate();const dip=new Date(year,month,0).getDate();
  const evMap={};for(const ev of events){const ds=gp(ev,'日付').slice(0,10);if(!ds)continue;if(!evMap[ds])evMap[ds]=[];evMap[ds].push(ev);}
  const grid=document.getElementById('cal-grid');grid.innerHTML='';
  for(let i=0;i<42;i++){
    const cell=document.createElement('div');cell.className='cal-cell';
    let dayNum,dateStr,isOther=false;const dow=i%7;
    if(i<firstDay){dayNum=dip-(firstDay-1-i);dateStr=isoLocal(new Date(year,month-1,dayNum));isOther=true;}
    else if(i-firstDay<dim){dayNum=i-firstDay+1;dateStr=isoLocal(new Date(year,month,dayNum));}
    else{dayNum=i-firstDay-dim+1;dateStr=isoLocal(new Date(year,month+1,dayNum));isOther=true;}
    if(isOther)cell.classList.add('other-month');if(dateStr===todayStr)cell.classList.add('today-cell');
    const ne=document.createElement('div');
    if(dateStr===todayStr){ne.className='day-num is-today';}else{ne.className='day-num'+(dow===0?' sun':dow===6?' sat':'');}
    ne.textContent=dayNum;cell.appendChild(ne);
    if(evMap[dateStr]){const box=document.createElement('div');box.className='cal-evs';for(const ev of evMap[dateStr]){const s=gp(ev,'種別');const t=gp(ev,'担当者名');const y=gp(ev,'行き先');const dt=gp(ev,'日付');const j=dt.length>10?dt.slice(11,16):'';const el=document.createElement('div');el.className='cal-ev '+(s==='金消契約'?'ev-kinko':'ev-shurui');el.textContent=(j?j+' ':'')+t+(y?' ('+y+')':'');box.appendChild(el);}cell.appendChild(box);}
    grid.appendChild(cell);
  }
}
function buildCatch(entries){
  const grid=document.getElementById('catch-grid');grid.innerHTML='';
  const lm={};for(const loc of CATCH_LOCS)lm[loc]=[];
  for(const e of entries){const loc=gp(e,'配置場所');const t=gp(e,'担当者名');if(loc&&lm[loc]!==undefined&&t)lm[loc].push(t);}
  CATCH_LOCS.forEach((loc,idx)=>{
    const card=document.createElement('div');card.className='catch-card';
    const head=document.createElement('div');head.className='cc-head cc-'+idx;head.textContent=loc;card.appendChild(head);
    const body=document.createElement('div');body.className='cc-body';
    if(lm[loc].length===0){const s=document.createElement('span');s.className='no-data';s.textContent='予定なし';body.appendChild(s);}
    else{for(const m of lm[loc]){const tag=document.createElement('span');tag.className='m-tag';tag.textContent=m;body.appendChild(tag);}}
    card.appendChild(body);grid.appendChild(card);
  });
}

function renderToday(rows){

const R_FALLBACK={personal:R_SAMPLE_P,courses:R_SAMPLE_C};

// ---- 描画 ----
const rEsc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rY=v=>'¥'+Math.round(Number(v)||0).toLocaleString('ja-JP');
const rN=v=>(v==null||v==='')?'－':Number(v).toLocaleString('ja-JP');
// period: 'an'=年間 / 'q3'=3ヶ月通算
function rSorted(data,period){
  const a=period==='an'?'annual':'q3', c=a+'Cnt';
  const [k1,k2]=R_SORT_BY==='count'?[c,a]:[a,c];
  return [...data].sort((x,y)=>((y[k1]||0)-(x[k1]||0))||((y[k2]||0)-(x[k2]||0)));
}
const rRankCls=i=>i<3?' t'+(i+1):'';
const rHeader=cols=>cols.map((c,i)=>`<div class="r-h${i>=3?' num':''}">${c}</div>`).join('');
const rEmpty=msg=>`<div class="r-empty">${msg}</div>`;
function rRow(i,hl,name,sub,cnt,amt,period){
  const h=i<hl?(period==='an'?' ta':' tg'):'';
  return `<div class="r-c r-rk${h}${rRankCls(i)}">${i+1}</div><div class="r-c r-nm${h}"><span>${rEsc(name)}</span></div><div class="r-c r-sub${h}">${rEsc(sub)}</div><div class="r-c r-cnt${h}">${rN(cnt)}</div><div class="r-c r-amt ${period}${h}">${rY(amt)}</div>`;
}
// 個人ランキング：順位 / 名前 / 役職 / 実数 / 売上予定金額
function rPersonal(id,data,period){
  const a=period==='an'?'annual':'q3';
  const rows=rSorted(data,period).slice(0,R_TOP_PERSONAL);
  document.getElementById(id).innerHTML=rHeader(['順位','名前','役職','実数','売上予定金額'])
    +(rows.length?rows.map((d,i)=>rRow(i,R_HL_PERSONAL,d.name,d.role||'',d[a+'Cnt'],d[a],period)).join(''):rEmpty('データがありません'));
}
// 課ランキング：順位 / 名前(課長) / 課 / 実数 / 売上予定金額
// Salesforce側のラベルが「投資営業1部1課」形式でも「川崎課」形式でも表示できるようにしています
function rCourseCells(d){
  const m=String(d.name||'').match(/(\d+)\s*部\s*(\d+)\s*課/);
  const dept=d.dept||(m?m[1]+'部':'');
  const kaNo=d.course||(m?m[2]+'課':'');
  const kaName=(!m&&/課$/.test(d.name||''))?d.name:'';
  const ka=(dept&&kaNo)?dept+kaNo:([dept,kaName].filter(Boolean).join(' ')||d.name||'');
  const chief=d.chief||R_CHIEF[dept+kaNo]||R_CHIEF[ka]||(kaName?kaName.replace(/課$/,''):'');
  return {chief,ka};
}
function rCourse(id,data,period){
  const a=period==='an'?'annual':'q3';
  const rows=rSorted(data,period);
  document.getElementById(id).innerHTML=rHeader(['順位','名前','課','実数','売上予定金額'])
    +(rows.length?rows.map((d,i)=>{const {chief,ka}=rCourseCells(d);return rRow(i,R_HL_COURSE,chief||'－',ka,d[a+'Cnt'],d[a],period);}).join(''):rEmpty('課別データを取得できませんでした'));
}
// Salesforceレポートを1件取得（失敗時はnull）
async function sfReport(reportKey){
  try{
    const r=await fetch('/api/salesforce',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reportKey})});
    if(!r.ok)return null;
    const j=await r.json();
    return j.success?(j.data||[]):null;
  }catch(e){return null;}
}
// 年間と3ヶ月のレポートを名前で突き合わせて1件にまとめる（amount→売上予定金額, count→実数）
function rMerge(annualRows,q3Rows){
  const map=new Map();
  (annualRows||[]).forEach(r=>map.set(r.name,{...r,annual:r.amount||0,annualCnt:r.count||0,q3:0,q3Cnt:0}));
  (q3Rows||[]).forEach(r=>{const e=map.get(r.name);if(e){e.q3=r.amount||0;e.q3Cnt=r.count||0;}else map.set(r.name,{...r,annual:0,annualCnt:0,q3:r.amount||0,q3Cnt:r.count||0});});
  return [...map.values()];
}
async function renderRanking(){
  rTime=Date.now();
  const st=document.getElementById('r-status');st.textContent='読込中...';st.title='';
  let data;
  try{
    const [anP,q3P,anC,q3C]=await Promise.all([
      sfReport('annual_personal'),sfReport('q3_personal'),
      sfReport('annual_course'),sfReport('q3_course')
    ]);
    if(!anP)throw new Error('個人レポートを取得できませんでした');
    const personal=rMerge(anP,q3P);
    const courses=rMerge(anC,q3C); // 課別が取れない場合は空表示（実データにサンプルは混ぜない）
    data={personal,courses};
    st.textContent=`Salesforce連携 ${personal.length}名 / ${courses.length}課 / 更新 `+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
    if(!courses.length){st.title='課別レポートを取得できませんでした';}
  }
  catch(e){
    console.error('Ranking fetch error:',e);
    data=R_FALLBACK;
    st.textContent='※サンプルデータ表示中（Salesforce未接続）';
    st.title=String(e.message||e);
  }
  document.getElementById('r-p-note').textContent=`上位${Math.min(R_TOP_PERSONAL,data.personal.length)}名`;
  document.getElementById('r-c-note').textContent=`全${data.courses.length}課`;
  rPersonal('r-p-an',data.personal,'an');rPersonal('r-p-q3',data.personal,'q3');
  rCourse('r-c-an',data.courses,'an');rCourse('r-c-q3',data.courses,'q3');
}
